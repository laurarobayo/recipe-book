<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Recipe — Recipe Book</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <h1>Recipe <span>Book</span></h1>
    <nav>
      <a href="{{ url_for('index') }}">← All Recipes</a>
    </nav>
  </header>

  <main>
    <h2 class="page-title">Add a Recipe</h2>
    <p class="page-subtitle">Fill in the details below to save a new recipe.</p>

    <div class="form-card">
      <form method="POST" action="{{ url_for('add_recipe') }}">

        <div class="form-group">
          <label for="name">Recipe Name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Spaghetti Carbonara" required />
        </div>

        <div class="form-group">
          <label>Ingredients</label>
          <div id="ingredients-list">
            <div class="ingredient-row">
              <input type="text" name="ingredient_item" placeholder="Ingredient (e.g. Pasta)" required />
              <input type="text" name="ingredient_amount" placeholder="Amount (e.g. 200g)" required />
              <button type="button" class="remove-btn" onclick="removeRow(this)" title="Remove">×</button>
            </div>
          </div>
          <button type="button" class="add-ingredient-btn" onclick="addIngredient()">+ Add Ingredient</button>
        </div>

        <div class="form-group">
          <label for="instructions">Instructions</label>
          <textarea id="instructions" name="instructions" placeholder="Describe the steps to make this recipe..." required></textarea>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary">Save Recipe</button>
          <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>

      </form>
    </div>
  </main>

  <script>
    function addIngredient() {
      const list = document.getElementById('ingredients-list');
      const row = document.createElement('div');
      row.className = 'ingredient-row';
      row.innerHTML = `
        <input type="text" name="ingredient_item" placeholder="Ingredient" />
        <input type="text" name="ingredient_amount" placeholder="Amount" />
        <button type="button" class="remove-btn" onclick="removeRow(this)" title="Remove">×</button>
      `;
      list.appendChild(row);
      row.querySelector('input').focus();
    }

    function removeRow(btn) {
      const rows = document.querySelectorAll('.ingredient-row');
      if (rows.length > 1) {
        btn.closest('.ingredient-row').remove();
      }
    }
  </script>
</body>
</html>
