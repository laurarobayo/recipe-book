<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Recipe — Recipe Book</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <h1>Recipe <span>Book</span></h1>
    <nav>
      <a href="{{ url_for('index') }}">← All Recipes</a>
    </nav>
  </header>

  <main>
    <h2 class="page-title">Edit Recipe</h2>
    <p class="page-subtitle">Update the details below and save.</p>

    <div class="form-card">
      <form method="POST" action="{{ url_for('edit_recipe', recipe_id=recipe._id) }}">

        <div class="form-group">
          <label for="name">Recipe Name</label>
          <input type="text" id="name" name="name" value="{{ recipe.name }}" required />
        </div>

        <div class="form-group">
          <label>Ingredients</label>
          <div id="ingredients-list">
            {% for ing in recipe.ingredients %}
            <div class="ingredient-row">
              <input type="text" name="ingredient_item" value="{{ ing.item }}" placeholder="Ingredient" />
              <input type="text" name="ingredient_amount" value="{{ ing.amount }}" placeholder="Amount" />
              <button type="button" class="remove-btn" onclick="removeRow(this)">×</button>
            </div>
            {% endfor %}
          </div>
          <button type="button" class="add-ingredient-btn" onclick="addIngredient()">+ Add Ingredient</button>
        </div>

        <div class="form-group">
          <label for="instructions">Instructions</label>
          <textarea id="instructions" name="instructions" required>{{ recipe.instructions }}</textarea>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a href="{{ url_for('view_recipe', recipe_id=recipe._id) }}" class="btn btn-secondary">Cancel</a>
        </div>

      </form>
    </div>
  </main>

  <script>
    function addIngredient() {
      const list = document.getElementById('ingredients-list');
      const row = document.createElement('div');
      row.className = 'ingredient-row';
      row.innerHTML = `
        <input type="text" name="ingredient_item" placeholder="Ingredient" />
        <input type="text" name="ingredient_amount" placeholder="Amount" />
        <button type="button" class="remove-btn" onclick="removeRow(this)">×</button>
      `;
      list.appendChild(row);
      row.querySelector('input').focus();
    }

    function removeRow(btn) {
      const rows = document.querySelectorAll('.ingredient-row');
      if (rows.length > 1) {
        btn.closest('.ingredient-row').remove();
      }
    }
  </script>
</body>
</html>
