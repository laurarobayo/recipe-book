<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ recipe.name }} — Recipe Book</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <h1>Recipe <span>Book</span></h1>
    <nav>
      <a href="{{ url_for('index') }}">← All Recipes</a>
    </nav>
  </header>

  <main>
    <div class="recipe-detail">
      <h1>{{ recipe.name }}</h1>
      <hr class="divider accent" />

      <p class="section-label">Ingredients</p>
      <table class="ingredients-table">
        {% for ing in recipe.ingredients %}
          <tr>
            <td>{{ ing.amount }}</td>
            <td>{{ ing.item }}</td>
          </tr>
        {% endfor %}
      </table>

      <hr class="divider" />

      <p class="section-label">Instructions</p>
      <p class="instructions-text">{{ recipe.instructions }}</p>

      <div class="actions">
        <a href="{{ url_for('index') }}" class="btn btn-secondary">← Back</a>
        <button class="btn btn-danger" onclick="document.getElementById('confirm').classList.add('active')">
          Delete Recipe
        </button>
      </div>
    </div>
  </main>

  <!-- Delete confirmation overlay -->
  <div class="confirm-overlay" id="confirm">
    <div class="confirm-box">
      <h3>Delete Recipe?</h3>
      <p>This will permanently remove <strong>{{ recipe.name }}</strong>. This cannot be undone.</p>
      <div class="actions">
        <button class="btn btn-secondary" onclick="document.getElementById('confirm').classList.remove('active')">Cancel</button>
        <form method="POST" action="{{ url_for('delete_recipe', recipe_id=recipe._id) }}" style="display:inline;">
          <button type="submit" class="btn btn-danger">Yes, Delete</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
